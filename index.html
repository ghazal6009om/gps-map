<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خريطة صور الـ GPS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; background: #111; font-family: Tahoma, sans-serif; }

        #map { height: 100vh; width: 100vw; }

        #topbar {
            position: fixed; top: 12px; right: 12px; z-index: 999;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        #info {
            background: rgba(0,0,0,0.7); color: #fff; padding: 8px 14px;
            border-radius: 20px; font-size: 13px; pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4); white-space: nowrap;
        }
        #toggleLayer {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: #fff; font-size: 20px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        #toggleLayer:hover { transform: scale(1.15); }

        .photo-marker {
            background: #fff; border: 2px solid #fff; border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5); overflow: hidden;
            width: 50px; height: 50px; position: relative;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; cursor: pointer;
        }
        .photo-marker:hover { transform: scale(1.25); z-index: 1000; }
        .photo-marker img { width: 100%; height: 100%; object-fit: cover; }
        .photo-marker::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); border-width: 6px 6px 0;
            border-style: solid; border-color: #fff transparent; width: 0;
        }

        .modal {
            display: none; position: fixed; z-index: 2000; inset: 0;
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
            flex-direction: column; padding: 20px;
        }
        .modal.show { display: flex; }
        .modal img { max-width: 90%; max-height: 75vh; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.7); }
        .modal .meta { color: #ddd; margin-top: 12px; font-size: 13px; text-align: center; }
        .close-btn {
            position: absolute; top: 15px; right: 25px; color: #fff;
            font-size: 40px; font-weight: bold; cursor: pointer; line-height: 1;
        }
        .close-btn:hover { color: #ff6666; }
    </style>
</head>
<body>

    <!-- الخريطة -->
    <div id="map"></div>

    <div id="topbar">
        <div id="info"></div>
        <button id="toggleLayer" title="تبديل النوع">🛰</button>
    </div>

    <!-- نافذة عرض الصورة بالحجم الكامل -->
    <div id="photoModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="" alt="صورة مكبرة">
        <div class="meta" id="modalMeta"></div>
    </div>

    <script src="js/leaflet.js"></script>
    <script>
        const map = L.map('map', { attributionControl: false }).setView([23.5880, 58.3829], 10);

            const satelliteEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
            const satelliteGoogle = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
            const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });

            // ثلاث طبقات: 0=google, 1=esri, 2=streets
            const layers = [satelliteGoogle, satelliteEsri, streets];
            const layerIcons = ['🛰', '🗾', '🗺'];
            let currentIdx = 0;
            layers[0].addTo(map);

            document.getElementById('toggleLayer').addEventListener('click', function() {
                map.removeLayer(layers[currentIdx]);
                currentIdx = (currentIdx + 1) % layers.length;
                layers[currentIdx].addTo(map);
                this.textContent = layerIcons[(currentIdx + 1) % 3];
            });

            function createPhotoIcon(imgUrl) {
                return L.divIcon({
                    className: 'custom-div-icon',
                    html: '<div class="photo-marker"><img src="' + imgUrl + '" alt=""></div>',
                    iconSize: [50, 60], iconAnchor: [25, 60]
                });
            }

            let loaded = 0;
            const markers = [];

            fetch('test_payload.json')
                .then(r => r.json())
                .then(data => {
                    data.forEach(item => {
                        if (item.lat && item.lng) {
                            const marker = L.marker([item.lat, item.lng], {
                                icon: createPhotoIcon(item.img || 'IMG_5282.jpg')
                            }).addTo(map);
                            marker.on('click', () => openModal(item.img || 'IMG_5282.jpg', item.lat, item.lng));
                            markers.push(marker);
                        }
                        loaded++;
                        document.getElementById('info').textContent = '📷 ' + loaded + ' صورة';
                    });

                    // fit bounds
                    if (markers.length > 0) {
                        const group = L.featureGroup(markers);
                        map.fitBounds(group.getBounds().pad(0.15));
                    }
                })
                .catch(error => {
                    console.error('خطأ في تحميل البيانات:', error);
                    document.getElementById('info').textContent = 'خطأ في تحميل البيانات';
                });

        function openModal(src, lat, lng) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalMeta').innerHTML =
                'خط العرض: ' + lat.toFixed(6) + ' &nbsp; | &nbsp; خط الطول: ' + lng.toFixed(6);
            document.getElementById('photoModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('show');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
